
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Inventory Management - GreenMart</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f4;
            margin: 0;
            padding: 30px;
            color: #263326;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        h1 {
            color: #247a40;
            margin-top: 0;
        }

        .summary {
            display: flex;
            gap: 20px;
            margin: 25px 0;
            flex-wrap: wrap;
        }

        .summary-card {
            flex: 1;
            min-width: 180px;
            padding: 20px;
            border-radius: 8px;
            background-color: #e8f5eb;
        }

        .summary-card.warning {
            background-color: #fff2d6;
        }

        .summary-card.danger {
            background-color: #fde8e8;
        }

        .summary-card h2 {
            margin: 0 0 10px;
            font-size: 16px;
        }

        .summary-card p {
            font-size: 28px;
            font-weight: bold;
            margin: 0;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #e6f3e9;
        }

        .status {
            display: inline-block;
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
        }

        .in-stock {
            background-color: #dff3e5;
            color: #176534;
        }

        .low-stock {
            background-color: #fff0c2;
            color: #8a5900;
        }

        .out-of-stock {
            background-color: #fde2e2;
            color: #a32121;
        }

        .update-form {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .quantity-input {
            width: 75px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .btn {
            padding: 9px 14px;
            border: none;
            border-radius: 6px;
            background-color: #27864b;
            color: white;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #1d6939;
        }

        .message {
            padding: 12px;
            border-radius: 6px;
            margin: 15px 0;
        }

        .success {
            background-color: #e3f5e8;
            color: #176534;
        }

        .error {
            background-color: #fde8e8;
            color: #a32121;
        }

        .empty {
            text-align: center;
            color: #777;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Inventory Management</h1>

    <p>
        Monitor product stock levels and update inventory
        quantities.
    </p>

    <!-- Success Message -->
    <div class="message success"
         th:if="${success}"
         th:text="${success}">
    </div>

    <!-- Error Message -->
    <div class="message error"
         th:if="${error}"
         th:text="${error}">
    </div>

    <!-- Inventory Summary -->
    <div class="summary">

        <div class="summary-card">
            <h2>Total Products</h2>
            <p th:text="${#lists.size(products)}">0</p>
        </div>

        <div class="summary-card warning">
            <h2>Low Stock Products</h2>
            <p th:text="${lowStockCount}">0</p>
        </div>

        <div class="summary-card danger">
            <h2>Out of Stock Products</h2>
            <p th:text="${outOfStockCount}">0</p>
        </div>

    </div>

    <!-- Inventory Table -->
    <div class="table-wrapper">
        <table>

            <thead>
            <tr>
                <th>ID</th>
                <th>Product Name</th>
                <th>Category</th>
                <th>Available Quantity</th>
                <th>Stock Status</th>
                <th>Update Stock</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="product : ${products}">

                <td th:text="${product.id}"></td>

                <td th:text="${product.name}"></td>

                <td th:text="${product.category}"></td>

                <td th:text="${product.quantity}"></td>

                <!-- Stock Status -->
                <td>

                    <span class="status in-stock"
                          th:if="${product.quantity > 5}">
                        In Stock
                    </span>

                    <span class="status low-stock"
                          th:if="${product.quantity > 0
                                  and product.quantity <= 5}">
                        Low Stock
                    </span>

                    <span class="status out-of-stock"
                          th:if="${product.quantity == 0}">
                        Out of Stock
                    </span>

                </td>

                <!-- Update Stock Form -->
                <td>

                    <form class="update-form"
                          th:action="@{/inventory/update/{id}(id=${product.id})}"
                          method="post">

                        <input type="number"
                               name="quantity"
                               class="quantity-input"
                               th:value="${product.quantity}"
                               min="0"
                               required>

                        <button type="submit"
                                class="btn">
                            Update
                        </button>

                    </form>

                </td>

            </tr>

            <!-- Empty Inventory Message -->
            <tr th:if="${#lists.isEmpty(products)}">
                <td colspan="6" class="empty">
                    No products found in inventory.
                </td>
            </tr>

            </tbody>

        </table>
    </div>

</div>

</body>
</html>
